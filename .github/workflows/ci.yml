name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    name: Typecheck, test, build (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [embedded, postgres]
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: cognexus
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: cognexus_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cognexus -d cognexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run security:scan
      - run: npm run check
      - run: npm run format:check
      - run: npm test
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://cognexus:ci-only-password@127.0.0.1:5432/cognexus_test' || '' }}
      - run: npm run build
      - run: npm run smoke
        if: matrix.database == 'embedded'
      - name: Compiled restart and disposable coordinated restore drill
        run: npm run restore:drill
        env:
          PILOT_POSTGRES_CONTAINER: ${{ matrix.database == 'postgres' && job.services.postgres.id || '' }}
          PILOT_POSTGRES_ADMIN_URL: ${{ matrix.database == 'postgres' && 'postgresql://cognexus:ci-only-password@127.0.0.1:5432/cognexus_test' || '' }}
      - run: npm audit --audit-level=moderate
  browser:
    name: Built browser journey and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
      - name: Bounded synthetic benchmark (measurements, no performance threshold claim)
        run: npm run benchmark
  container:
    name: Verify production container builds
    runs-on: ubuntu-latest
    env:
      PUBLIC_ORIGIN: https://cognexus-ci.invalid
      POSTGRES_PASSWORD: ci-app-only-password
      POSTGRES_ADMIN_PASSWORD: ci-admin-only-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          build-args: APP_REVISION=${{ github.sha }}
          tags: |
            cognexus:security-review
            cognexus-ci-app:latest
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cognexus:security-review
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          cache: 'false'
      - name: Verify restricted-role production startup
        run: docker compose --project-name cognexus-ci up --no-build --detach --wait --wait-timeout 120
      - name: Verify production HTTP readiness and authentication boundary
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='http://127.0.0.1:3001/api';
          assert.equal((await fetch(`${base}/ready`)).status,200);
          assert.equal((await fetch(`${base}/projects`)).status,401);
          const session=await (await fetch(`${base}/session`)).json();
          assert.equal(session.user,null);
          assert.equal(session.registrationRestricted,true);
          JS
      - name: Remove isolated CI containers and test volumes
        if: always()
        run: docker compose --project-name cognexus-ci down --volumes
