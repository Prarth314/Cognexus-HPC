name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    name: Typecheck, test, build (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [embedded, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cognexus
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: cognexus_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cognexus -d cognexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://cognexus:ci-only-password@127.0.0.1:5432/cognexus_test' || '' }}
      - run: npm run build
      - run: npm run smoke
        if: matrix.database == 'embedded'
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v7
        if: matrix.database == 'embedded'
        with:
          name: application-build
          path: |
            dist/
            dist-server/
          retention-days: 7
  container:
    name: Verify production container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
