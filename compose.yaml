services:
  app:
    build:
      context: .
      args:
        APP_REVISION: ${APP_REVISION:-unrecorded}
    init: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the public HTTPS origin}
      DATABASE_URL: postgresql://cognexus_app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/cognexus
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      ALLOW_EXTERNAL_AI: 'false'
      OPERATIONS_TOKEN: ${OPERATIONS_TOKEN:-}
      DATA_DIR: /app/data
    volumes:
      - artifacts:/app/data
    depends_on:
      database:
        condition: service_healthy
    mem_limit: 1g
    stop_grace_period: 60s
    cpus: 2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  database:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment:
      POSTGRES_USER: cognexus
      POSTGRES_DB: cognexus
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set a separate POSTGRES_ADMIN_PASSWORD}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-cognexus.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cognexus -d cognexus']
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
volumes:
  postgres:
  artifacts:
